name: Triage PR

# Maps PR titles to release-note labels and assigns eligible authors.
# pull_request_target gives fork PRs a write token. No PR code is checked out,
# and untrusted title and author values only reach the script through env vars.

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  triage:
    name: Label and assign PR
    runs-on: ubuntu-latest
    steps:
      - name: Label from title
        if: github.event.action != 'edited' || github.event.changes.title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          label=""
          if [[ "$PR_TITLE" =~ ^chore:\ prepare\ v[0-9.]+\ release ]]; then
            label="release"
          elif [[ "$PR_TITLE" =~ ^(chore|build|ci)\(deps(-dev)?\)!?: ]]; then
            label="dependencies"
          elif [[ "$PR_TITLE" =~ ^fix\(security\)!?: ]]; then
            label="security"
          elif [[ "$PR_TITLE" =~ ^([a-z]+)(\([^\)]*\))?!?: ]]; then
            case "${BASH_REMATCH[1]}" in
              feat) label="feature" ;;
              fix) label="bugfix" ;;
              docs) label="documentation" ;;
              perf) label="performance" ;;
              security) label="security" ;;
              ci) label="ci" ;;
            esac
          fi

          current_labels=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
          for managed in feature bugfix documentation performance security dependencies ci release; do
            if [[ "$managed" != "$label" ]] && grep -Fxq "$managed" <<< "$current_labels"; then
              gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$managed" --silent
            fi
          done
          if [[ -n "$label" ]] && ! grep -Fxq "$label" <<< "$current_labels"; then
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f "labels[]=$label" --silent
          fi

      - name: Assign eligible author
        if: github.event.action == 'opened' && github.event.pull_request.user.type == 'User'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          assignable=$(gh api --paginate "repos/$GH_REPO/assignees" --jq '.[].login')
          if grep -Fxq "$PR_AUTHOR" <<< "$assignable"; then
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/assignees" -f "assignees[]=$PR_AUTHOR" --silent
          fi
