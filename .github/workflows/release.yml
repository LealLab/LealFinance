name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 1.2.3)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/leallab/lealfinance-api:${{ inputs.tag }}
            ghcr.io/leallab/lealfinance-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/leallab/lealfinance-web:${{ inputs.tag }}
            ghcr.io/leallab/lealfinance-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
