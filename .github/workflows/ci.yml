name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lealfinance
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: lealfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lealfinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lealfinance:ci-password@localhost:5432/lealfinance
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - name: Dependency audit
        run: |
          uv export --no-dev --no-emit-project --format requirements.txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Migration round-trip
        # Ends on downgrade (empty schema), not upgrade - pytest's fixtures
        # build their own schema directly from the ORM metadata (see
        # tests/conftest.py) and would collide with Alembic's seeded BRL
        # row if this left the DB at head.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Test
        # Coverage (>=80% gate) is configured in pyproject.toml so it runs
        # identically via `task backend:test`. The suite refuses any database
        # not named *_test and creates this one itself (see tests/conftest.py);
        # the round-trip step above keeps using the job-level `lealfinance` URL.
        env:
          DATABASE_URL: postgresql+psycopg://lealfinance:ci-password@localhost:5432/lealfinance_test
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Validate translations (no missing/orphaned keys)
        run: |
          pnpm exec transloco-keys-manager find
          node scripts/validate-i18n.mjs

      - name: Test
        # Coverage (>=80% gate on lines) is configured in angular.json's test
        # target, so this is identical to `task frontend:test`.
        run: pnpm exec ng test

      - name: Build
        run: pnpm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
          COMPOSE_PROFILES=agents docker compose config --quiet

      - name: Build images
        run: docker compose build

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install smoke-test dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start the homelab stack
        # Explicit -f: plain `docker compose` also loads the dev override,
        # which exposes database ports and runs the API with --reload. This
        # is the shape docs/homelab-deploy.md tells operators to run.
        #
        # --wait is scoped to api + web (and their deps): `beat` has no
        # healthcheck by design, and older compose fails `--wait` on any
        # service that lacks one. worker/beat aren't exercised by the smoke
        # test or the backup check.
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 240 api web

      - name: Browser smoke test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: pnpm run e2e

      - name: Verify instance backup and restore
        run: |
          sh scripts/backup.sh
          sh scripts/restore-verify.sh

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Stop the homelab stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

      # worker/beat share the api image's Dockerfile/context byte-for-byte
      # (see docker-compose.yml) - scanning api + web covers every distinct
      # image actually built.
      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lealfinance-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lealfinance-web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
