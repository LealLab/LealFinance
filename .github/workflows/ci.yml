name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lealfinance
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: lealfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lealfinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lealfinance:ci-password@localhost:5432/lealfinance
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - name: Dependency audit
        run: |
          uv export --no-dev --no-emit-project --format requirements.txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Migration round-trip
        # Ends on downgrade (empty schema), not upgrade - pytest's fixtures
        # build their own schema directly from the ORM metadata (see
        # tests/conftest.py) and would collide with Alembic's seeded BRL
        # row if this left the DB at head.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Test
        # Coverage (>=80% gate) is configured in pyproject.toml so it runs
        # identically via `task backend:test`.
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Validate translations (no missing/orphaned keys)
        run: |
          pnpm exec transloco-keys-manager find
          node scripts/validate-i18n.mjs

      - name: Test
        # Coverage (>=80% gate on lines) is configured in angular.json's test
        # target, so this is identical to `task frontend:test`.
        run: pnpm exec ng test

      - name: Build
        run: pnpm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
          COMPOSE_PROFILES=agents docker compose config --quiet

      - name: Build images
        run: docker compose build

      # worker/beat share the api image's Dockerfile/context byte-for-byte
      # (see docker-compose.yml) - scanning api + web covers every distinct
      # image actually built.
      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lealfinance-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lealfinance-web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
