version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # Dockerfiles live in backend/ and frontend/, not at the repo root.
  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  # Images named in docker-compose*.yml (postgres, redis, ollama, caddy).
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types:
          - minor
          - patch
