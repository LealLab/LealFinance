allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Transitive deps pinned to their patched versions ahead of the parent
# packages picking them up. fast-uri / qs come via @angular-eslint/builder;
# js-yaml via @jsverse/transloco-utils > cosmiconfig (GHSA-2883-xcg3-v3hh);
# undici via @jsverse/transloco-keys-manager > cheerio; zod via @angular/cdk >
# @angular/forms; vite and source-map-js via @angular/build.
overrides:
  fast-uri: '^3.1.6'
  qs: '^6.16.0'
  js-yaml: '^4.3.2'
  'undici@^7': '^7.30.1'
  zod: '^4.6.6'
  vite: '^8.3.3'
  source-map-js: '^1.2.2'
