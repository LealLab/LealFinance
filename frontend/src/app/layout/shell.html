<div *transloco="let t" class="flex min-h-screen bg-surface-page text-content-primary">
  <!-- t(layout.languageSwitcher.options.en-US) t(layout.languageSwitcher.options.pt-BR) t(layout.languageSwitcher.options.es-ES) t(layout.languageSwitcher.options.fr-FR) t(layout.languageSwitcher.options.de-DE) t(layout.languageSwitcher.options.it-IT) t(layout.languageSwitcher.options.nl-NL) t(layout.languageSwitcher.options.pl-PL) t(layout.languageSwitcher.options.ru-RU) t(layout.languageSwitcher.options.uk-UA) t(layout.languageSwitcher.options.tr-TR) t(layout.languageSwitcher.options.ar) t(layout.languageSwitcher.options.he-IL) t(layout.languageSwitcher.options.hi-IN) t(layout.languageSwitcher.options.zh-CN) t(layout.languageSwitcher.options.zh-TW) t(layout.languageSwitcher.options.ja-JP) t(layout.languageSwitcher.options.ko-KR) t(layout.languageSwitcher.options.id-ID) t(layout.languageSwitcher.options.vi-VN) t(layout.languageSwitcher.options.th-TH) t(layout.languageSwitcher.options.sv-SE) t(layout.languageSwitcher.options.da-DK) t(layout.languageSwitcher.options.nb-NO) t(layout.languageSwitcher.options.fi-FI) t(layout.languageSwitcher.options.cs-CZ) t(layout.languageSwitcher.options.ro-RO) t(layout.languageSwitcher.options.el-GR) -->
  <aside
    id="desktop-sidebar"
    class="desktop-sidebar relative hidden shrink-0 flex-col border-r border-border bg-surface-raised md:sticky md:top-0 md:flex md:h-screen md:self-start"
    [class.is-expanded]="sidebarExpanded()"
    [class.is-collapsed]="!sidebarExpanded()"
  >
    <button
      appButton
      variant="secondary"
      size="sm"
      type="button"
      class="absolute right-0 top-1/2 z-20 !h-8 !w-8 !-translate-y-1/2 !translate-x-1/2 !rounded-full !p-0 shadow-sm"
      data-sidebar-toggle
      (click)="toggleSidebar()"
      [attr.aria-controls]="'desktop-sidebar'"
      [attr.aria-expanded]="sidebarExpanded()"
      [attr.aria-label]="
        sidebarExpanded() ? t('layout.sidebar.collapse') : t('layout.sidebar.expand')
      "
    >
      <app-icon name="chevronRight" [size]="14" [class.rotate-180]="sidebarExpanded()" />
    </button>

    <div
      class="flex items-center justify-between gap-2 px-3 py-4"
      [class.flex-col]="!sidebarExpanded()"
      [class.flex-row]="sidebarExpanded()"
    >
      <a routerLink="/" class="flex min-w-0 items-center gap-2">
        <app-logo [size]="26" class="shrink-0 text-accent" />
        <span
          class="truncate text-sm font-semibold tracking-tight"
          [class.hidden]="!sidebarExpanded()"
        >
          {{ t('app.title') }}
        </span>
      </a>
      <div
        class="flex items-center gap-0.5"
        [class.flex-col]="!sidebarExpanded()"
        [class.flex-row]="sidebarExpanded()"
      >
        <button
          appButton
          variant="ghost"
          size="sm"
          type="button"
          (click)="toggleBalances()"
          [attr.aria-label]="
            balanceVisibility.hidden()
              ? t('layout.balanceToggle.show')
              : t('layout.balanceToggle.hide')
          "
        >
          <app-icon [name]="balanceVisibility.hidden() ? 'eyeOff' : 'eye'" [size]="18" />
        </button>
        <button
          appButton
          variant="ghost"
          size="sm"
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="
            theme.current() === 'dark'
              ? t('layout.themeToggle.switchToLight')
              : t('layout.themeToggle.switchToDark')
          "
        >
          <app-icon [name]="theme.current() === 'dark' ? 'sun' : 'moon'" [size]="18" />
        </button>
      </div>
    </div>

    <div class="px-3 pb-3">
      <button
        appButton
        variant="secondary"
        type="button"
        class="w-full !justify-between !px-2.5 !py-1.5 text-content-muted"
        (click)="commandPalette.show()"
      >
        <span class="flex items-center gap-2">
          <app-icon name="search" [size]="16" />
          <span [class.hidden]="!sidebarExpanded()">{{ t('layout.search.trigger') }}</span>
        </span>
        <span
          class="shrink-0 items-center gap-0.5 rounded border border-border px-1.5 py-0.5 font-mono text-[11px] text-content-subtle"
          [class.hidden]="!sidebarExpanded()"
          [class.flex]="sidebarExpanded()"
        >
          {{ isMac ? '⌘K' : 'Ctrl K' }}
        </span>
      </button>
    </div>

    <app-sidebar variant="rail" [expanded]="sidebarExpanded()" class="flex-1 overflow-y-auto" />

    <div
      class="border-t border-border"
      [class.p-1]="!sidebarExpanded()"
      [class.p-3]="sidebarExpanded()"
    >
      <label
        class="flex items-center text-sm text-content-muted"
        [class.gap-1]="!sidebarExpanded()"
        [class.gap-2]="sidebarExpanded()"
        [class.justify-center]="!sidebarExpanded()"
      >
        <span class="sr-only">{{ t('layout.languageSwitcher.label') }}</span>
        @if (sidebarExpanded()) {
          <app-icon name="globe" [size]="16" class="shrink-0" />
        }
        <div class="relative" [class.w-full]="sidebarExpanded()">
          @if (!sidebarExpanded()) {
            <div
              aria-hidden="true"
              class="flex h-8 w-8 items-center justify-between rounded-md border border-border bg-surface-raised px-1 text-xs font-medium text-content-muted"
            >
              <span>{{ activeLangCode() }}</span>
              <app-icon name="chevronDown" [size]="10" />
            </div>
          }
          <select
            [class]="
              sidebarExpanded()
                ? 'w-full min-w-0 rounded-md border border-border bg-surface-raised px-2 py-1 text-sm text-content-muted'
                : 'absolute inset-0 h-8 w-8 cursor-pointer bg-surface-raised text-content-muted opacity-0'
            "
            [attr.aria-label]="t('layout.languageSwitcher.label')"
            [value]="activeLang()"
            (change)="setLang($any($event.target).value)"
          >
            @for (lang of availableLangs; track lang) {
              <option [value]="lang">{{ t('layout.languageSwitcher.options.' + lang) }}</option>
            }
          </select>
        </div>
      </label>
      <button
        appButton
        variant="ghost"
        size="sm"
        type="button"
        class="mt-2 w-full"
        (click)="session.logout()"
      >
        <span [class.hidden]="!sidebarExpanded()">{{ t('auth.logout') }}</span>
        <app-icon name="arrowDownLeft" [size]="16" />
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="flex items-center gap-3 border-b border-border bg-surface-raised px-4 py-3 md:hidden"
    >
      <button
        appButton
        variant="ghost"
        size="sm"
        type="button"
        (click)="mobileNavOpen.set(true)"
        [attr.aria-label]="t('layout.sidebar.openMenu')"
      >
        <app-icon name="menu" [size]="20" />
      </button>
      <a routerLink="/" class="flex items-center gap-2 text-sm font-semibold tracking-tight">
        <app-logo [size]="22" class="text-accent" />
        {{ t('app.title') }}
      </a>
    </header>

    <main class="flex-1 px-4 py-6 md:px-6 md:py-8">
      @if (mutationErrors.translationKey(); as key) {
        <div class="mb-4 flex items-center justify-between gap-3 rounded-md border border-negative/30 bg-negative/10 p-3 text-sm text-negative" role="alert">
          {{ t(key) }}
          <button type="button" class="font-medium" (click)="mutationErrors.clear()">{{ t('common.actions.close') }}</button>
        </div>
      }
      <router-outlet />
    </main>
  </div>

  <!-- Backdrop-click-to-dismiss is a mouse convenience on top of the
       dialog's native Escape handling, not the only way to close it, and
       the inner div below only stops click bubbling (no user action) - the
       two rules below don't apply to either. -->
  <!-- eslint-disable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <dialog
    #drawer
    class="mobile-drawer m-0 h-dvh max-h-none w-72 max-w-[85vw] rounded-none border-0 border-r border-border bg-surface-raised p-0 backdrop:bg-black/40"
    style="inset: 0 auto 0 0"
    (close)="onDrawerNativeClose()"
    (click)="onDrawerBackdropClick($event)"
  >
    <div class="flex h-full flex-col" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-border px-4 py-3">
        <span class="flex items-center gap-2 text-sm font-semibold tracking-tight">
          <app-logo [size]="22" class="text-accent" />
          {{ t('app.title') }}
        </span>
        <button
          appButton
          variant="ghost"
          size="sm"
          type="button"
          (click)="mobileNavOpen.set(false)"
          [attr.aria-label]="t('common.actions.close')"
        >
          <app-icon name="close" [size]="16" />
        </button>
      </div>

      <div class="flex items-center justify-between gap-2 border-b border-border px-4 py-2.5">
        <div class="flex items-center gap-0.5">
          <button
            appButton
            variant="ghost"
            size="sm"
            type="button"
            (click)="toggleBalances()"
            [attr.aria-label]="
              balanceVisibility.hidden()
                ? t('layout.balanceToggle.show')
                : t('layout.balanceToggle.hide')
            "
          >
            <app-icon [name]="balanceVisibility.hidden() ? 'eyeOff' : 'eye'" [size]="18" />
          </button>
          <button
            appButton
            variant="ghost"
            size="sm"
            type="button"
            (click)="toggleTheme()"
            [attr.aria-label]="
              theme.current() === 'dark'
                ? t('layout.themeToggle.switchToLight')
                : t('layout.themeToggle.switchToDark')
            "
          >
            <app-icon [name]="theme.current() === 'dark' ? 'sun' : 'moon'" [size]="18" />
          </button>
        </div>
        <label class="flex items-center gap-2 text-sm text-content-muted">
          <span class="sr-only">{{ t('layout.languageSwitcher.label') }}</span>
          <select
            class="rounded-md border border-border bg-surface-raised px-2 py-1 text-sm text-content-muted"
            [value]="activeLang()"
            (change)="setLang($any($event.target).value)"
          >
            @for (lang of availableLangs; track lang) {
              <option [value]="lang">{{ t('layout.languageSwitcher.options.' + lang) }}</option>
            }
          </select>
        </label>
      </div>

      <div class="border-b border-border px-4 py-2.5">
        <button
          appButton
          variant="secondary"
          type="button"
          class="w-full !justify-between !px-2.5 !py-1.5 text-content-muted"
          (click)="openCommandPalette()"
        >
          <span class="flex items-center gap-2">
            <app-icon name="search" [size]="16" />
            {{ t('layout.search.trigger') }}
          </span>
        </button>
      </div>

      <app-sidebar
        variant="drawer"
        class="flex-1 overflow-y-auto"
        (navigated)="mobileNavOpen.set(false)"
      />
      <div class="border-t border-border p-3">
        <button
          appButton
          variant="secondary"
          type="button"
          class="w-full"
          (click)="session.logout()"
        >
          {{ t('auth.logout') }}
        </button>
      </div>
    </div>
  </dialog>
  <!-- eslint-enable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->

  <app-command-palette />
  <app-confirm-dialog />
</div>
