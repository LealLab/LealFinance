<nav *transloco="let t" class="flex flex-col gap-0.5 p-2">
  @for (item of navItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-surface-sunken text-content-primary"
      [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      (click)="navigated.emit()"
      class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-content-muted hover:bg-surface-sunken hover:text-content-primary"
    >
      <app-icon [name]="item.icon" [size]="18" />
      <span [class]="labelClass()">{{ t(item.labelKey) }}</span>
    </a>
  }
</nav>
