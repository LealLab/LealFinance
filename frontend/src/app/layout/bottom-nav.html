<nav
  *transloco="let t"
  class="fixed inset-x-0 bottom-0 z-30 flex border-t border-border bg-surface-raised pr-[env(safe-area-inset-right)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] md:hidden"
>
  @for (tab of nav.tabs(); track tab.labelKey) {
    <a
      [routerLink]="tab.items[0].path"
      class="flex min-h-14 min-w-0 flex-1 flex-col items-center justify-center gap-0.5 px-0.5 text-[11px] font-medium"
      [class.text-accent]="nav.activeTab() === tab"
      [class.text-content-muted]="nav.activeTab() !== tab"
      [attr.aria-current]="nav.activeTab() === tab ? 'page' : null"
    >
      <app-icon [name]="tab.icon" [size]="22" />
      <span class="max-w-full truncate">{{ t(tab.labelKey) }}</span>
    </a>
  }
</nav>
