<div *transloco="let t">
  <app-modal [(open)]="open" [titleText]="t('rules.packs.title')">
    <div class="flex flex-col gap-2">
      @for (pack of packs(); track pack.code) {
        <div class="flex items-center justify-between gap-4 rounded-md border border-border p-3">
          <div class="flex min-w-0 items-center gap-3">
            <span class="text-xl" aria-hidden="true">{{ packFlag(pack) }}</span>
            <div>
              <p class="font-medium text-content-primary">{{ packName(pack) }}</p>
              <p class="text-xs text-content-muted">
                {{ t('rules.packs.rulesCount', { count: pack.ruleCount }) }}
              </p>
            </div>
          </div>
          @if (pack.installed) {
            <app-badge tone="positive">{{ t('rules.packs.installed') }}</app-badge>
          } @else {
            <button
              appButton
              variant="secondary"
              size="sm"
              type="button"
              [disabled]="installing() !== undefined"
              (click)="installPack(pack)"
            >
              {{ t('rules.packs.install') }}
            </button>
          }
        </div>
      }
      @if (resultMessage(); as message) {
        <p class="text-sm text-positive" role="status">{{ message }}</p>
      }
    </div>
  </app-modal>
</div>
