<div *transloco="let t" class="mx-auto max-w-3xl">
  <app-page-header [title]="t('onboarding.title')" [description]="t('onboarding.description')" />

  <app-card>
    <ol class="flex flex-col gap-3" aria-label="{{ t('onboarding.title') }}">
      @for (item of steps; track item.number) {
        <li
          class="rounded-md border border-border p-4"
          [class.border-accent]="step() === item.number"
          [attr.aria-current]="step() === item.number ? 'step' : null"
        >
          <div class="flex items-start gap-3">
            <span
              class="flex size-7 shrink-0 items-center justify-center rounded-full bg-surface-sunken text-sm font-semibold text-content-muted"
              [class.bg-accent]="step() === item.number"
              [class.text-white]="step() === item.number"
            >
              {{ item.number }}
            </span>
            <div class="min-w-0 flex-1">
              <h2 class="text-sm font-semibold text-content-primary">
                <button
                  type="button"
                  class="cursor-pointer rounded text-left hover:underline"
                  (click)="progress.setStep(item.number)"
                >
                  {{ t(item.titleKey) }}
                </button>
              </h2>
              @if (step() === item.number) {
                <p class="mt-1 text-sm text-content-muted">{{ t(item.descriptionKey) }}</p>
                <div class="mt-4 flex flex-wrap items-center gap-2">
                  <button appButton type="button" variant="primary" (click)="continue()">
                    {{
                      item.number === 3
                        ? t('onboarding.actions.import')
                        : item.number === 5
                          ? t('onboarding.actions.recurring')
                          : t('onboarding.actions.continue')
                    }}
                  </button>
                  @if (item.number === 3) {
                    <button
                      appButton
                      type="button"
                      variant="secondary"
                      (click)="addFirstTransaction()"
                    >
                      {{ t('onboarding.actions.transaction') }}
                    </button>
                  }
                  @if (item.number === 5) {
                    <button appButton type="button" variant="secondary" (click)="setUpBudget()">
                      {{ t('onboarding.actions.budget') }}
                    </button>
                  }
                  <button appButton type="button" variant="ghost" (click)="skipStep()">
                    {{ t('onboarding.actions.skip') }}
                  </button>
                </div>
              }
            </div>
          </div>
        </li>
      }
    </ol>

    <div class="mt-5 flex justify-end border-t border-border pt-4">
      <button appButton type="button" variant="ghost" (click)="dismissSetup()">
        {{ t('onboarding.actions.dismiss') }}
      </button>
    </div>
  </app-card>
</div>
