<div *transloco="let t">
  <!-- The icons.names.* lookup used by app-icon-picker below is looked up
       dynamically (string concatenation), which transloco-keys-manager's
       template extractor can't resolve - it carries its own marker comment
       in icon-picker.html (see category-form-modal.html for the same
       "dynamic markings" mechanism). -->
  <!-- @if…as (not a plain call) avoids a translation-argument pattern the
       extractor mis-parses - see account-form-modal.html for the full
       explanation. -->
  @if (titleKey(); as title) {
    <app-modal [(open)]="open" [titleText]="t(title)">
      <form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="submit()">
        <div>
          <label class="form-label" for="institution-name">{{ t('institutions.form.fields.name') }}</label>
          <input id="institution-name" type="text" class="form-input" formControlName="name" />
          @if (form.controls.name.invalid && form.controls.name.touched) {
            <p class="form-error">{{ t('institutions.form.errors.required') }}</p>
          }
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="form-label" for="institution-color">{{ t('institutions.form.fields.color') }}</label>
            <button
              id="institution-color"
              type="button"
              class="form-input flex h-10 items-center gap-2"
              aria-haspopup="dialog"
              (click)="colorPickerOpen.set(true)"
            >
              <span
                class="size-5 shrink-0 rounded border border-border"
                [style.background-color]="selectedColor()"
                aria-hidden="true"
              ></span>
              <span class="font-mono text-sm">{{ selectedColor() }}</span>
            </button>
            <app-color-picker
              [(open)]="colorPickerOpen"
              [color]="selectedColor()"
              [titleText]="t('institutions.form.fields.color')"
              (colorChange)="form.controls.color.setValue($event)"
            />
          </div>
          <div>
            <label class="form-label" for="institution-icon">{{ t('institutions.form.fields.icon') }}</label>
            <button
              id="institution-icon"
              type="button"
              class="form-input flex items-center gap-2"
              (click)="iconPickerOpen.set(true)"
            >
              <app-icon [name]="selectedIcon()" />
              <span>{{ t('icons.names.' + selectedIcon()) }}</span>
            </button>
            <app-icon-picker
              [(open)]="iconPickerOpen"
              [selected]="selectedIcon()"
              (picked)="form.controls.icon.setValue($event)"
            />
          </div>
        </div>

        @if (saveErrorKey(); as errorKey) {
          <p class="form-error" role="alert">{{ t(errorKey) }}</p>
        }
        @if (deleteErrorKey(); as errorKey) {
          <p class="form-error" role="alert">{{ t(errorKey) }}</p>
        }

        <div class="mt-2 flex items-center justify-between gap-2">
          @if (institution()) {
            <button
              appButton
              variant="ghost"
              type="button"
              [disabled]="deleting()"
              (click)="deleteInstitution()"
            >
              {{ t('institutions.actions.delete') }}
            </button>
          } @else {
            <span></span>
          }
          <div class="flex gap-2">
            <button appButton type="button" variant="secondary" (click)="open.set(false)">
              {{ t('institutions.form.actions.cancel') }}
            </button>
            <button appButton type="submit" variant="primary" [disabled]="saving()">
              {{ t('institutions.form.actions.save') }}
            </button>
          </div>
        </div>
      </form>
    </app-modal>
  }
</div>
