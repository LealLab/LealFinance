<div *transloco="let t" class="mb-6 flex flex-col gap-3">
  <div class="flex items-center gap-2">
    <div class="relative min-w-0 flex-1 md:max-w-sm">
      <app-icon
        name="search"
        [size]="16"
        class="pointer-events-none absolute top-1/2 start-3 -translate-y-1/2 text-content-subtle"
      />
      <label class="sr-only" for="tx-filter-search">{{ t('transactions.filters.searchPlaceholder') }}</label>
      <input
        id="tx-filter-search"
        type="search"
        class="form-input mt-0 ps-9"
        [placeholder]="t('transactions.filters.searchPlaceholder')"
        [value]="search()"
        (input)="onSearch($any($event.target).value)"
      />
    </div>

    <div class="hidden items-center gap-2 md:flex">
      <select
        id="tx-filter-type"
        class="form-input mt-0 w-auto"
        [attr.aria-label]="t('transactions.filters.type')"
        (change)="patch('type', $any($event.target).value)"
      >
        <option value="" [selected]="!filters().type">{{ t('transactions.filters.type') }}</option>
        @for (type of transactionTypes; track type) {
          <option [value]="type" [selected]="filters().type === type">{{ t('transactions.type.' + type) }}</option>
        }
      </select>
      <select
        id="tx-filter-account"
        class="form-input mt-0 w-auto"
        [attr.aria-label]="t('transactions.filters.account')"
        (change)="patch('accountId', $any($event.target).value)"
      >
        <option value="" [selected]="!filters().accountId">{{ t('transactions.filters.account') }}</option>
        @for (account of accounts(); track account.id) {
          <option [value]="account.id" [selected]="filters().accountId === account.id">{{ account.name }}</option>
        }
      </select>
      <select
        id="tx-filter-category"
        class="form-input mt-0 w-auto"
        [attr.aria-label]="t('transactions.filters.category')"
        (change)="patch('categoryId', $any($event.target).value)"
      >
        <option value="" [selected]="!filters().categoryId">{{ t('transactions.filters.category') }}</option>
        @for (section of categoryOptions(); track section.group.id) {
          <optgroup [label]="section.group.name">
            @for (category of section.categories; track category.id) {
              <option [value]="category.id" [selected]="filters().categoryId === category.id">{{ category.name }}</option>
            }
          </optgroup>
        }
      </select>
    </div>

    <button
      appButton
      variant="secondary"
      type="button"
      data-action="open-filters"
      (click)="sheetOpen.set(true)"
    >
      <app-icon name="funnel" [size]="16" />
      <span class="max-[22rem]:sr-only">{{ t('transactions.filters.title') }}</span>
      @if (chips().length > 0) {
        <span class="min-w-5 rounded bg-accent px-1.5 text-center text-xs font-semibold text-accent-content">{{ chips().length }}</span>
      }
    </button>

    @if (hasActive()) {
      <button
        appButton
        variant="ghost"
        size="sm"
        type="button"
        data-action="clear-filters"
        class="max-md:hidden"
        (click)="clear()"
      >
        {{ t('transactions.filters.clear') }}
      </button>
    }
  </div>

  @if (chips().length > 0) {
    <div class="chip-rail flex gap-2 overflow-x-auto md:flex-wrap md:overflow-visible">
      @for (chip of chips(); track chip.key) {
        <span
          class="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-border bg-surface-sunken px-2.5 py-1 text-xs whitespace-nowrap text-content-primary"
        >
          <app-icon [name]="chip.icon" [size]="14" class="text-content-muted" />
          <span class="text-content-muted">{{ t(chip.labelKey) }}:</span>
          <span class="font-medium">{{ chip.value }}</span>
          <button
            type="button"
            class="ms-0.5 rounded-full p-0.5 hover:bg-surface-raised [@media(pointer:coarse)]:p-2.5"
            [attr.aria-label]="t('transactions.filters.removeChip', { filter: t(chip.labelKey) })"
            (click)="removeChip(chip.key)"
          >
            <app-icon name="close" [size]="12" />
          </button>
        </span>
      }
    </div>
  }

  <app-modal [(open)]="sheetOpen" [sheet]="true" [titleText]="t('transactions.filters.title')">
    <div class="flex flex-col gap-4">
      <div class="md:hidden">
        <label class="form-label" for="tx-sheet-type">{{ t('transactions.filters.type') }}</label>
        <select id="tx-sheet-type" class="form-input" (change)="patch('type', $any($event.target).value)">
          <option value="" [selected]="!filters().type">{{ t('transactions.filters.any') }}</option>
          @for (type of transactionTypes; track type) {
            <option [value]="type" [selected]="filters().type === type">{{ t('transactions.type.' + type) }}</option>
          }
        </select>
      </div>

      <div class="md:hidden">
        <label class="form-label" for="tx-sheet-account">{{ t('transactions.filters.account') }}</label>
        <select id="tx-sheet-account" class="form-input" (change)="patch('accountId', $any($event.target).value)">
          <option value="" [selected]="!filters().accountId">{{ t('transactions.filters.any') }}</option>
          @for (account of accounts(); track account.id) {
            <option [value]="account.id" [selected]="filters().accountId === account.id">{{ account.name }}</option>
          }
        </select>
      </div>

      <div class="md:hidden">
        <label class="form-label" for="tx-sheet-category">{{ t('transactions.filters.category') }}</label>
        <select id="tx-sheet-category" class="form-input" (change)="patch('categoryId', $any($event.target).value)">
          <option value="" [selected]="!filters().categoryId">{{ t('transactions.filters.any') }}</option>
          @for (section of categoryOptions(); track section.group.id) {
            <optgroup [label]="section.group.name">
              @for (category of section.categories; track category.id) {
                <option [value]="category.id" [selected]="filters().categoryId === category.id">{{ category.name }}</option>
              }
            </optgroup>
          }
        </select>
      </div>

      <div>
        <label class="form-label" for="tx-sheet-group">{{ t('transactions.filters.group') }}</label>
        <select id="tx-sheet-group" class="form-input" (change)="patch('groupId', $any($event.target).value)">
          <option value="" [selected]="!filters().groupId">{{ t('transactions.filters.any') }}</option>
          @for (group of groups(); track group.id) {
            <option [value]="group.id" [selected]="filters().groupId === group.id">{{ group.name }}</option>
          }
        </select>
      </div>

      <div>
        <label class="form-label" for="tx-sheet-institution">{{ t('transactions.filters.institution') }}</label>
        <select id="tx-sheet-institution" class="form-input" (change)="patch('institutionId', $any($event.target).value)">
          <option value="" [selected]="!filters().institutionId">{{ t('transactions.filters.any') }}</option>
          @for (institution of institutions(); track institution.id) {
            <option [value]="institution.id" [selected]="filters().institutionId === institution.id">{{ institution.name }}</option>
          }
        </select>
      </div>

      <div class="grid grid-cols-1 gap-4 min-[26rem]:grid-cols-2">
        <div>
          <label class="form-label" for="tx-sheet-from">{{ t('transactions.filters.from') }}</label>
          <input id="tx-sheet-from" type="date" class="form-input" [value]="filters().from" (change)="patch('from', $any($event.target).value)" />
        </div>
        <div>
          <label class="form-label" for="tx-sheet-to">{{ t('transactions.filters.to') }}</label>
          <input id="tx-sheet-to" type="date" class="form-input" [value]="filters().to" (change)="patch('to', $any($event.target).value)" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 min-[26rem]:grid-cols-2">
        <div>
          <label class="form-label" for="tx-sheet-amount-min">{{ t('transactions.filters.amountMin') }}</label>
          <input
            id="tx-sheet-amount-min"
            type="number"
            min="0"
            step="0.01"
            class="form-input"
            [value]="filters().amountMin"
            (change)="patch('amountMin', $any($event.target).value)"
          />
        </div>
        <div>
          <label class="form-label" for="tx-sheet-amount-max">{{ t('transactions.filters.amountMax') }}</label>
          <input
            id="tx-sheet-amount-max"
            type="number"
            min="0"
            step="0.01"
            class="form-input"
            [value]="filters().amountMax"
            (change)="patch('amountMax', $any($event.target).value)"
          />
        </div>
      </div>

      <div class="flex flex-wrap justify-end gap-2 border-t border-border pt-4">
        <button appButton variant="secondary" type="button" data-action="clear-filters-sheet" (click)="clear()">
          {{ t('transactions.filters.clear') }}
        </button>
        <button appButton variant="primary" type="button" (click)="sheetOpen.set(false)">
          {{ t('transactions.filters.apply') }}
        </button>
      </div>
    </div>
  </app-modal>
</div>
