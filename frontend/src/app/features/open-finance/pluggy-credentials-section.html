<div *transloco="let t">
  <app-card>
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h2 class="text-sm font-semibold text-content-primary">{{ t('openFinance.credentials.title') }}</h2>
        <p class="mt-1 max-w-2xl text-sm text-content-muted">{{ t('openFinance.credentials.description') }}</p>
      </div>
      @if (status()?.configured) {
        <app-badge tone="positive">{{ t('openFinance.credentials.configured') }}</app-badge>
      }
    </div>

    <form [formGroup]="form" class="mt-5 grid grid-cols-1 gap-4 md:grid-cols-3" (ngSubmit)="save()">
      <div>
        <label class="form-label" for="pluggy-client-id">{{ t('openFinance.credentials.fields.clientId') }}</label>
        <input id="pluggy-client-id" class="form-input" type="text" autocomplete="username" formControlName="clientId" />
      </div>
      <div>
        <label class="form-label" for="pluggy-client-secret">{{ t('openFinance.credentials.fields.clientSecret') }}</label>
        <input id="pluggy-client-secret" class="form-input" type="password" autocomplete="current-password" formControlName="clientSecret" />
      </div>
      <div>
        <label class="form-label" for="pluggy-environment">{{ t('openFinance.credentials.fields.environment') }}</label>
        <select id="pluggy-environment" class="form-input" formControlName="environment">
          <option value="sandbox">{{ t('openFinance.credentials.sandbox') }}</option>
          <option value="production">{{ t('openFinance.credentials.production') }}</option>
        </select>
      </div>

      @if (errorKey(); as key) {
        <p class="form-error md:col-span-3" role="alert">{{ t(key) }}</p>
      }

      <div class="flex flex-wrap justify-end gap-2 md:col-span-3">
        @if (status()?.configured) {
          <button appButton type="button" variant="ghost" [disabled]="saving()" (click)="unlink()">
            {{ t('openFinance.credentials.actions.unlink') }}
          </button>
        }
        <button appButton type="submit" variant="primary" [disabled]="saving()">
          {{ saving() ? t('openFinance.credentials.actions.saving') : t('openFinance.credentials.actions.save') }}
        </button>
      </div>
    </form>
  </app-card>
</div>
