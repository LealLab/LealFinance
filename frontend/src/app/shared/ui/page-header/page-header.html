<div class="mb-6 flex flex-wrap items-start justify-between gap-4">
  <div class="flex flex-col gap-1">
    @if (eyebrow()) {
      <p class="text-xs font-medium uppercase tracking-wide text-content-subtle">{{ eyebrow() }}</p>
    }
    <h1 class="text-xl font-semibold tracking-tight text-content-primary">{{ title() }}</h1>
    @if (description()) {
      <p class="max-w-2xl text-sm text-content-muted">{{ description() }}</p>
    }
  </div>
  <div class="flex w-full flex-wrap items-center gap-2 sm:w-auto">
    <ng-content />
  </div>
</div>
