<div class="relative flex h-full flex-col gap-1 rounded-md border border-border bg-surface-raised p-4">
  <div class="flex items-start justify-between gap-2">
    <span class="text-xs font-medium tracking-wide text-content-muted uppercase">{{ label() }}</span>
    <ng-content select="[statTileAction]" />
  </div>
  <span
    class="font-mono font-semibold tabular-nums break-words"
    [class]="toneClass[tone()]"
    [class.text-xl]="!prominent()"
    [class.sm:text-2xl]="!prominent() || prominentUntil() === 'sm'"
    [class.text-3xl]="prominent()"
    [class.sm:text-4xl]="prominent() && prominentUntil() === 'lg'"
    [class.lg:text-2xl]="prominent() && prominentUntil() === 'lg'"
  >
    {{ value() }}
  </span>
  @if (hint()) {
    <span class="text-xs text-content-subtle">{{ hint() }}</span>
  }
</div>
