<div *transloco="let t">
  <!-- icons.names.* is looked up dynamically (string concatenation), which
       transloco-keys-manager's template extractor can't resolve - these
       marker-only comments are its "dynamic markings" mechanism (see
       category-form-modal.html for the same pattern). -->
  <!-- t(icons.names.home) t(icons.names.wallet) t(icons.names.swap) t(icons.names.tag) -->
  <!-- t(icons.names.target) t(icons.names.chart) t(icons.names.settings) t(icons.names.sun) -->
  <!-- t(icons.names.moon) t(icons.names.globe) t(icons.names.menu) t(icons.names.close) -->
  <!-- t(icons.names.plus) t(icons.names.trash) t(icons.names.pencil) t(icons.names.chevronDown) -->
  <!-- t(icons.names.chevronRight) t(icons.names.check) t(icons.names.alertTriangle) t(icons.names.repeat) -->
  <!-- t(icons.names.archive) t(icons.names.arrowUpRight) t(icons.names.arrowDownLeft) t(icons.names.refresh) -->
  <!-- t(icons.names.search) t(icons.names.eye) t(icons.names.eyeOff) t(icons.names.command) -->
  <!-- t(icons.names.cornerDownLeft) t(icons.names.zap) t(icons.names.grip) t(icons.names.bank) -->
  <!-- t(icons.names.piggy) -->
  <app-modal [(open)]="open" [titleText]="t('icons.title')">
    <div class="flex flex-col gap-3">
      <input
        type="search"
        class="form-input"
        [placeholder]="t('icons.search')"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />
      @if (filtered().length) {
        <div class="grid grid-cols-4 gap-2 sm:grid-cols-6">
          @for (name of filtered(); track name) {
            <button
              type="button"
              class="flex flex-col items-center gap-1 rounded-md border p-2 text-content-muted transition-colors hover:bg-surface-sunken"
              [class]="
                name === selected()
                  ? 'border-accent bg-accent/10 text-accent'
                  : 'border-transparent'
              "
              [attr.aria-label]="t('icons.names.' + name)"
              [attr.aria-pressed]="name === selected()"
              [title]="t('icons.names.' + name)"
              (click)="pick(name)"
            >
              <app-icon [name]="name" [size]="24" />
              <span class="w-full truncate text-center text-xs">{{ t('icons.names.' + name) }}</span>
            </button>
          }
        </div>
      } @else {
        <p class="py-6 text-center text-sm text-content-muted">{{ t('icons.empty') }}</p>
      }
    </div>
  </app-modal>
</div>
