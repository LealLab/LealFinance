  <app-modal [(open)]="open" [titleText]="t('icons.title')">
    <div class="flex flex-col gap-3">
      <input
        type="search"
        class="form-input"
        [placeholder]="t('icons.search')"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />
      @if (filtered().length) {
        <div class="icon-sections flex max-h-96 flex-col gap-4 overflow-y-auto">
          @for (section of filtered(); track section.group) {
            <div class="flex flex-col gap-2">
              <h3 class="text-xs font-semibold uppercase text-content-muted">
                {{ t('icons.groups.' + section.group) }}
              </h3>
              <div class="grid grid-cols-4 gap-2 sm:grid-cols-6">
                @for (name of section.names; track name) {
                  <button
                    type="button"
                    class="flex flex-col items-center gap-1 rounded-md border p-2 text-content-muted transition-colors hover:bg-surface-sunken"
                    [class]="
                      name === selected()
                        ? 'border-accent bg-accent/10 text-accent'
                        : 'border-transparent'
                    "
                    [attr.aria-label]="t('icons.names.' + name)"
                    [attr.aria-pressed]="name === selected()"
                    [title]="t('icons.names.' + name)"
                    (click)="pick(name)"
                  >
                    <app-icon [name]="name" [size]="24" />
                    <span class="w-full truncate text-center text-xs">{{ t('icons.names.' + name) }}</span>
                  </button>
                }
              </div>
            </div>
          }
        </div>
      } @else {
        <p class="py-6 text-center text-sm text-content-muted">{{ t('icons.empty') }}</p>
      }
    </div>
  </app-modal>
</div>
