<div class="flex flex-col items-center gap-3 rounded-md border border-dashed border-border py-12 text-center">
  <span class="flex size-10 items-center justify-center rounded-full bg-surface-sunken text-content-muted">
    <app-icon [name]="icon()" [size]="20" />
  </span>
  <div class="flex flex-col gap-1">
    <p class="text-sm font-medium text-content-primary">{{ title() }}</p>
    @if (description()) {
      <p class="max-w-sm text-sm text-content-muted">{{ description() }}</p>
    }
  </div>
  <ng-content />
</div>
