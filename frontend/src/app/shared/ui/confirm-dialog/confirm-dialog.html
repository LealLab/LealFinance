@if (confirmService.request(); as request) {
  <div *transloco="let t">
    <app-modal [open]="open()" (openChange)="onOpenChange($event)" [titleText]="t(request.titleKey)">
      <p class="text-sm text-content-primary">{{ t(request.messageKey) }}</p>
      <div class="mt-4 flex justify-end gap-2">
        <button appButton variant="secondary" type="button" (click)="respond(false)">
          {{ t('common.actions.cancel') }}
        </button>
        <button appButton [variant]="confirmVariant()" type="button" (click)="respond(true)">
          {{ t('common.actions.confirm') }}
        </button>
      </div>
    </app-modal>
  </div>
}
