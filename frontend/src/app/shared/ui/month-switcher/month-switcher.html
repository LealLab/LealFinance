<div class="flex items-center gap-1">
  <button
    appButton
    variant="secondary"
    size="sm"
    type="button"
    (click)="stepMonth(-1)"
    [attr.aria-label]="prevLabel() || null"
  >
    <app-icon name="chevronRight" [size]="16" class="rotate-180" />
  </button>
  <span class="min-w-32 text-center text-sm font-medium text-content-primary">
    {{ label() }}
  </span>
  <button
    appButton
    variant="secondary"
    size="sm"
    type="button"
    (click)="stepMonth(1)"
    [attr.aria-label]="nextLabel() || null"
  >
    <app-icon name="chevronRight" [size]="16" />
  </button>
</div>
