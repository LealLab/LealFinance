<ng-container *transloco="let t">
  <app-modal [(open)]="open" [titleText]="t(titleKey())">
    <form class="flex flex-col gap-4" (submit)="$event.preventDefault(); submit()">
      <p class="text-sm text-content-muted">{{ t(messageKey()) }}</p>
      <label>
        <span class="form-label">{{ t('profile.password.currentPassword') }}</span>
        <input
          id="password-confirm-input"
          class="form-input"
          type="password"
          autocomplete="current-password"
          [value]="password()"
          [attr.aria-invalid]="errorKey() ? true : null"
          [attr.aria-describedby]="errorKey() ? 'password-confirm-error' : null"
          (input)="password.set($any($event.target).value)"
        />
      </label>
      @if (errorKey(); as key) {
        <p id="password-confirm-error" class="text-sm text-negative" role="alert">{{ t(key) }}</p>
      }
      <div class="flex flex-wrap items-center justify-end gap-2">
        <button
          appButton
          type="button"
          variant="ghost"
          class="max-md:flex-1"
          [disabled]="busy()"
          (click)="open.set(false)"
        >
          {{ t('common.actions.cancel') }}
        </button>
        <button
          appButton
          type="submit"
          class="max-md:flex-1"
          [disabled]="!password() || busy()"
        >
          {{ busy() ? t('common.actions.saving') : t('common.actions.confirm') }}
        </button>
      </div>
    </form>
  </app-modal>
</ng-container>
