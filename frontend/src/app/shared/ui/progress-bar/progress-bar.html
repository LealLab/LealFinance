<div
  class="h-2 w-full overflow-hidden rounded-full bg-surface-sunken"
  role="progressbar"
  [attr.aria-valuenow]="percentClamped()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-label]="label()"
>
  <div
    class="h-full rounded-full transition-[width]"
    [class]="fillClass()"
    [style.width.%]="percentClamped()"
  ></div>
</div>
