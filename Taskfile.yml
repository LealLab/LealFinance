# Cross-platform task runner. Install: https://taskfile.dev
# Usage: task <name>   (e.g. `task backend:test`, `task up`)
version: "3"
dotenv: [".env"]

tasks:
  install:
    desc: Install and start the published production stack
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

  uninstall:
    desc: Stop and remove the production stack, preserving data
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml down

  uninstall:purge:
    desc: Remove the production stack and persistent data
    prompt: This permanently deletes the application data volumes. Continue?
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml down --volumes

  up:
    desc: Start the full stack (build + detached)
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop the full stack
    cmds:
      - docker compose down

  logs:
    desc: Tail logs for all services
    cmds:
      - docker compose logs -f

  backend:sync:
    desc: Install backend dependencies
    dir: backend
    cmds:
      - uv sync

  backend:dev:
    desc: Run the API locally with reload
    dir: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '{{.POSTGRES_HOST_PORT | default "55433"}}'
      REDIS_HOST: localhost
      REDIS_PORT: '{{.REDIS_HOST_PORT | default "6379"}}'
    cmds:
      - uv run python -m app.dev

  backend:lint:
    desc: Lint + format-check the backend
    dir: backend
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  backend:typecheck:
    desc: Type-check the backend
    dir: backend
    cmds:
      - uv run mypy app

  backend:test:
    desc: Run backend tests
    dir: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '{{.POSTGRES_HOST_PORT | default "55433"}}'
      # Tests build and drop their own schema - keep them off the dev
      # database. conftest.py refuses any database not named *_test and
      # creates this one on first run.
      POSTGRES_DB: '{{.POSTGRES_TEST_DB | default "lealfinance_test"}}'
      DATABASE_URL: ""
      REDIS_HOST: localhost
      REDIS_PORT: '{{.REDIS_HOST_PORT | default "6379"}}'
    cmds:
      - uv run pytest -q

  backend:migrate:
    desc: Apply database migrations
    dir: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '{{.POSTGRES_HOST_PORT | default "55433"}}'
    cmds:
      - uv run alembic upgrade head

  backend:migration:
    desc: 'Generate a new migration: task backend:migration -- "message"'
    dir: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '{{.POSTGRES_HOST_PORT | default "55433"}}'
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  backend:seed:
    desc: Apply migrations and generate local demo data
    dir: backend
    deps:
      - backend:migrate
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '{{.POSTGRES_HOST_PORT | default "55433"}}'
    cmds:
      - uv run python -m scripts.seed

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - pnpm install

  frontend:dev:
    desc: Run the Angular dev server
    dir: frontend
    cmds:
      - pnpm start

  frontend:lint:
    desc: Lint the frontend
    dir: frontend
    cmds:
      - pnpm run lint

  frontend:test:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - pnpm run test

  frontend:build:
    desc: Production build of the frontend
    dir: frontend
    cmds:
      - pnpm run build

  i18n:validate:
    desc: Check for missing/orphaned Transloco translation keys
    dir: frontend
    cmds:
      - pnpm exec transloco-keys-manager find
      - node scripts/validate-i18n.mjs

  security:audit:
    desc: Audit backend and frontend dependencies for known vulnerabilities
    cmds:
      - task: security:audit:backend
      - task: security:audit:frontend

  security:audit:backend:
    internal: true
    dir: backend
    cmds:
      - uv export --no-dev --no-emit-project --format requirements.txt -o .pip-audit-requirements.txt
      - uvx pip-audit -r .pip-audit-requirements.txt

  security:audit:frontend:
    internal: true
    dir: frontend
    cmds:
      - pnpm audit --audit-level=high
