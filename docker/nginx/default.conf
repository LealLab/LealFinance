server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular's dev-server-style SPA fallback: anything not a real static
    # file falls back to index.html so client-side routing works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - "api" is the docker-compose service name, resolved via
    # Docker's embedded DNS. Trailing slash on proxy_pass strips the
    # /api/ prefix before forwarding, since the FastAPI app itself
    # mounts routes under /api/v1 already.
    location /api/ {
        client_max_body_size 32M;
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets can be cached aggressively - the build hashes filenames.
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
