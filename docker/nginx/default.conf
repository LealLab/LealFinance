# Per-client-IP limits. This file is included in nginx's http context, so the
# zones can be declared here. Rates are generous for a household and tight
# enough to stop password guessing and request floods.
#   lf_auth: public sign-in/recovery/registration endpoints, ~10 a minute
#   lf_api:  everything else under /api/, 20 requests a second
limit_req_zone $binary_remote_addr zone=lf_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lf_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=lf_conn:10m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Behind the optional Caddy TLS proxy every request arrives from the Docker
    # network, so take the real client address from X-Forwarded-For - but only
    # when the hop is inside Docker's default private range. A client that
    # connects directly from a home LAN (192.168.x.x or 10.x.x.x) is not in
    # that range, so it cannot spoof the header to dodge the limits below.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Drop slow or stalled connections early.
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA reads this JSON body like any other API error and shows a
    # translated "too many requests" message.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"error.rate_limited","params":{}}}';
    }

    # Angular's dev-server-style SPA fallback: anything not a real static
    # file falls back to index.html so client-side routing works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public auth endpoints (sign in, passkey sign in, recovery, registration)
    # get the strict limit and a small body cap. A regex location cannot use a
    # proxy_pass URI, so the original /api/... path is forwarded unchanged,
    # which is exactly what the /api/ location below does as well.
    location ~ ^/api/v1/auth/(login|recover|register)(/|$) {
        limit_req zone=lf_auth burst=10 nodelay;
        limit_conn lf_conn 30;
        client_max_body_size 1M;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: $remote_addr is already the real client
        # address (see set_real_ip_from), and a single value cannot be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API - "api" is the docker-compose service name, resolved via
    # Docker's embedded DNS. Trailing slash on proxy_pass strips the
    # /api/ prefix before forwarding, since the FastAPI app itself
    # mounts routes under /api/v1 already.
    location /api/ {
        limit_req zone=lf_api burst=100 nodelay;
        limit_conn lf_conn 50;
        client_max_body_size 32M;
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Translation catalogs keep a stable URL but change between releases.
    # Revalidate them so browser refreshes pick up new translations.
    location ^~ /i18n/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Static assets can be cached aggressively - the build hashes filenames.
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
