# Security headers for every response served by the web container.
#
# nginx drops server-level add_header directives in any location that has its
# own add_header, so default.conf includes this file in those locations too.
#
# CSP notes: Angular injects component styles at runtime, hence
# style-src 'unsafe-inline'. The production build has no inline scripts
# (angular.json turns off critical-CSS inlining, which is what emitted one), so
# script-src stays 'self'. img-src allows data:/blob: for charts, icons and
# chat attachment previews. HSTS is set by Caddy, which is where TLS ends.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
