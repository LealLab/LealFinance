[project]
name = "lealfinance-api"
version = "0.1.0"
description = "LealFinance backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8",
    "celery[redis]>=5.6.3",
    "redis>=5.0.2,<6.5",
    # Runtime dep: app/services/exchange_rates.py calls Open Exchange Rates.
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# celery ships without type stubs / a py.typed marker.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# @celery_app.task(...) is untyped because of the above - can't be typed away
# from the call site, only from the module doing the decorating.
[[tool.mypy.overrides]]
module = ["app.workers.tasks.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
