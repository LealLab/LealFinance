[project]
name = "lealfinance-api"
version = "0.2.0"
description = "LealFinance backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8",
    "celery[redis]>=5.6.3",
    "redis>=5.0.2,<6.5",
    # Runtime dep: app/services/exchange_rates.py calls Open Exchange Rates.
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    # Runtime dep: app/core/crypto.py encrypts stored AI-provider credentials
    # (app/models/agent_credential.py) - the only secret in this codebase
    # that must be read back rather than one-way hashed.
    "cryptography>=46.0.3",
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# celery ships without type stubs / a py.typed marker.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# @celery_app.task(...) is untyped because of the above - can't be typed away
# from the call site, only from the module doing the decorating.
[[tool.mypy.overrides]]
module = ["app.workers.tasks.*"]
disallow_untyped_decorators = false

# The MCP SDK ships no py.typed marker; @mcp.custom_route(...) is untyped at
# the call site, same situation as the celery task decorator above.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.mcp.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=json --cov-fail-under=80"

[tool.coverage.run]
# SQLAlchemy's async engine suspends every `await db.execute(...)` through
# greenlet_spawn - without this, coverage.py's default sys.settrace tracer
# stops tracking lines after the first await in a function, undercounting
# real coverage by ~20 points. See SQLAlchemy's coverage.py integration docs.
concurrency = ["greenlet"]
